# Builds the Android app (mobile/, a Capacitor shell around the live web app)
# and uploads the signed APK as a workflow artifact.
#
# Run it from Actions → "Android APK" → Run workflow. It also runs when mobile/
# changes on main. Web changes need no new APK: the app loads the live site.
#
# Repository secrets (see mobile/README.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
# Without them a push only runs a test build (no APK is published), and a manual
# run stops: an APK signed with any other key could never be updated in place
# by a properly signed one.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish it as a GitHub Release (a public download link)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The runner image's SDK when it has one, else Google's command-line tools.
      - name: Android SDK
        working-directory: .
        run: |
          SDK="${ANDROID_HOME:-$HOME/android-sdk}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          (yes || true) | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install and sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            } >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "::notice::No signing key yet: running a test build only. Add the signing secrets (see mobile/README.md) to get an APK."
          else
            # Refuse rather than ship an APK signed with a throwaway key: phones
            # that install it could never take an update signed with the real one.
            echo "::error::Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS repository secrets first (see mobile/README.md)."
            exit 1
          fi

      - name: Build
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          if [ "$SIGNED" != "1" ]; then
            ./gradlew --no-daemon assembleDebug
            exit 0
          fi
          ./gradlew --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/WorkEasy360-HRMS-$APP_VERSION_NAME.apk"
          rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        if: ${{ env.SIGNED == '1' }}
        with:
          name: WorkEasy360-HRMS-${{ env.APP_VERSION_NAME }}
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release
        if: ${{ inputs.release && env.SIGNED == '1' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v$APP_VERSION_NAME" out/*.apk \
            --title "WorkEasy360 HRMS for Android $APP_VERSION_NAME" \
            --notes "Install on Android: download the APK on the phone, open it, and allow installs from this source when asked."
