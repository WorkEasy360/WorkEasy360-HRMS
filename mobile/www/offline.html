<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WorkEasy360 HRMS</title>
    <style>
      :root { --bg: #0C4F37; --text: #E7F5EE; --muted: #A3C8B6; --btn: #15803D; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(180deg, #0C4F37, #073326); color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 auto 24px; max-width: 280px; }
      button { background: var(--btn); color: #fff; border: 0; border-radius: 12px; font-size: 16px; font-weight: 600;
        padding: 14px 28px; min-width: 200px; }
      .mark { font-size: 26px; font-weight: 700; }
      .mark span { color: #4ADE80; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">WorkEasy<span>360</span> HRMS</div>
      <h1>You're offline</h1>
      <p>WorkEasy360 needs an internet connection. Check your Wi-Fi or mobile data and try again.</p>
      <button type="button" onclick="location.href='https://52-66-103-213.sslip.io/dashboard'">Try again</button>
    </main>
  </body>
</html>
